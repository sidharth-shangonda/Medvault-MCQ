services:
  - type: web
    name: medvault-pyq
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run import:questions
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: QUESTION_JSON_PATH
        value: data/questions.json
